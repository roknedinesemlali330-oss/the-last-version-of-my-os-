# MyOS: Hyprland configuration (classic syntax)
# Hyprland gives us: rounded corners, animations, shadows.

monitor = , preferred, auto, 1

# ----- autostart -----
exec-once = sh -c 'swaybg -i "$(cat "$HOME/.config/myos/wallpaper" 2>/dev/null || echo /usr/share/backgrounds/myos/wallpaper.png)" -m fill'
exec-once = sh -c 'systemctl --user start pipewire pipewire-pulse wireplumber'
exec-once = sh /etc/myos/start-shell.sh

env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24

# ----- input -----
input {
    kb_layout = us,ara
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    accel_profile = flat
    sensitivity = 0
}

# ----- layout -----
general {
    gaps_in = 6
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(4c7bdeff)
    col.inactive_border = rgba(c9d3eaff)
    layout = dwindle
}

dwindle {
    preserve_split = true
}

# ----- look: rounded corners and shadows -----
decoration {
    rounding = 14
    blur {
        enabled = false
    }
    shadow {
        enabled = true
        range = 14
        render_power = 3
        color = rgba(1a1a1a44)
    }
}

# ----- animations (opening, closing, workspace switch) -----
animations {
    enabled = true
    bezier = ease, 0.25, 0.8, 0.25, 1
    animation = windows, 1, 4, ease, popin 80%
    animation = windowsOut, 1, 4, ease, popin 80%
    animation = fade, 1, 4, ease
    animation = workspaces, 1, 5, ease, slide
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

# ----- shortcuts -----
$mod = SUPER

bind = $mod, Return, exec, foot
bind = $mod, E, exec, thunar
bind = $mod, B, exec, firefox-esr
bind = $mod SHIFT, Q, killactive
bind = ALT, F4, killactive
bind = $mod, F, fullscreen, 1
bind = $mod SHIFT, F, fullscreen, 0
bind = $mod, V, togglefloating
bind = $mod SHIFT, E, exit
bind = , Print, exec, grim
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy

# recovery: restart the shell using the previous stable version
bind = $mod SHIFT, R, exec, sh -c 'pkill -f "qs -p /etc/myos/shell.qml"; qs -p /etc/myos/stable/shell.qml'

# move / resize windows with Super + mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
